<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ffffff" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect x="16" y="16" width="480" height="480" rx="120" ry="120" fill="url(#bgGrad)" stroke="#262626" stroke-width="8"/>
  <!-- Minimalist Architectural Monogram 'A' -->
  <g filter="url(#subtleGlow)">
    <path d="M 148 388 L 256 124 L 364 388" fill="none" stroke="#f4f4f4" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 188 296 L 324 296" fill="none" stroke="#f4f4f4" stroke-width="44" stroke-linecap="round"/>
  </g>
</svg>

